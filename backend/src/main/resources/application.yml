spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stagedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:stage}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  redirect-uri: https://ticketstage.co.kr/oauth/kakao/callback

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    s3:
      bucket: ${AWS_S3_BUCKET:calendar-poster-storage}
    region:
      static: ${AWS_REGION:ap-southeast-2}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
